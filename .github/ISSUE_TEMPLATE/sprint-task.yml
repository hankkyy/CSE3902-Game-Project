name: Sprint task
description: Track one scoped Sprint 3 implementation task
title: "[S3][12] "
labels: ["sprint-3", "effort-12"]
body:
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: Describe the observable result, not just files to edit.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and effort breakdown
      placeholder: "Feature A (4 pts/5h), feature B (4/5h), tests/docs/review (4/5h)"
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: "- [ ] Build passes\n- [ ] Behavior is manually verified"
    validations:
      required: true
  - type: input
    id: branch
    attributes:
      label: Branch
      placeholder: feature/example
    validations:
      required: true
  - type: input
    id: remaining
    attributes:
      label: Initial remaining hours
      value: "15"
    validations:
      required: true
  - type: input
    id: reviewer
    attributes:
      label: Required reviewer and two review classes
      placeholder: "@reviewer — ClassOne and ClassTwo"
    validations:
      required: true
